<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Simulasi Dipol</title>
<style>body{font-family:Arial;text-align:center;background:#fff}canvas{border:1px solid #ccc}</style></head>
<body>
<h1>Simulasi Dipol</h1>
<canvas id="c" width="700" height="400"></canvas>
<p>Dipol terdiri dari dua sumber gelombang dengan fase berbeda yang menghasilkan pola interferensi.</p>
<script>
let c=document.getElementById('c'),ctx=c.getContext('2d'),t=0;
function draw(){
ctx.clearRect(0,0,700,400);
for(let x=0;x<700;x+=8){
for(let y=0;y<400;y+=8){
let r=Math.sin(Math.sqrt((x-350)**2+(y-200)**2)*0.06-t);
let v=Math.floor(150+r*80);
ctx.fillStyle="rgb("+v+",180,240)";
ctx.fillRect(x,y,8,8);
}
}
t+=0.05;requestAnimationFrame(draw);
}
draw();
</script></body></html>
